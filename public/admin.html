<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tricom FS — Panel de pacientes</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#F3EEE2; --green:#1E3B2C; --green-deep:#132A1E; --amber:#C48A3E; --line:rgba(30,59,44,.16); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--cream); font-family:'Inter',sans-serif; color:#26241D; }
  header{ background:var(--green); color:var(--cream); padding:22px 28px; }
  header h1{ font-family:'Newsreader',serif; font-weight:600; font-size:1.2rem; margin:0; }
  .wrap{ max-width:1100px; margin:0 auto; padding:32px 28px 60px; }

  .gate{ max-width:380px; margin:80px auto; text-align:center; }
  .gate input{ width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:1rem; margin:16px 0; }
  .gate button{ width:100%; padding:12px; border:none; border-radius:999px; background:var(--amber); color:var(--green-deep); font-weight:600; cursor:pointer; }
  .gate p.err{ color:#a13d2d; font-size:0.86rem; }

  .admin-toolbar{ display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
  #search-input{ flex:1 1 320px; padding:10px 14px; border:1px solid var(--line); border-radius:10px; font-family:'Inter',sans-serif; font-size:0.92rem; }
  .count{ opacity:0.7; font-size:0.9rem; white-space:nowrap; }

  table{ width:100%; border-collapse:collapse; font-size:0.9rem; background:#fff; }
  th, td{ text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ background:var(--green); color:var(--cream); font-weight:500; position:sticky; top:0; }
  tr:hover td{ background:rgba(196,138,62,0.06); }
  .muted{ opacity:0.6; }
  .empty{ opacity:0.6; padding:40px 0; text-align:center; }
  .table-wrap{ overflow-x:auto; border-radius:10px; border:1px solid var(--line); }
  .notes-cell{ min-width:180px; }
  .notes-input{ width:100%; font-family:'Inter',sans-serif; font-size:0.84rem; padding:6px 8px; border:1px solid var(--line); border-radius:8px; resize:vertical; }
  .notes-save{ margin-top:6px; font-size:0.78rem; padding:5px 12px; border-radius:999px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  .notes-save:hover{ border-color:var(--amber); color:var(--amber); }
  .notes-status{ margin-left:8px; font-size:0.76rem; opacity:0.7; }
</style>
</head>
<body>

<header><h1>Tricom FS — Panel de pacientes</h1></header>

<div class="wrap">
  <div class="gate" id="gate">
    <p>Ingresa la clave de administrador para ver el listado de pacientes.</p>
    <input type="password" id="key-input" placeholder="Clave de acceso" autocomplete="current-password">
    <button id="key-submit">Entrar</button>
    <p class="err" id="gate-err"></p>
  </div>

  <div id="content" style="display:none">
    <div class="admin-toolbar">
      <input type="text" id="search-input" placeholder="Buscar por nombre, correo, teléfono, diagnóstico…">
      <div class="count" id="count"></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Cita</th><th>Nombre</th><th>Contacto</th><th>Edad / Peso</th><th>Diagnóstico</th><th>Medicamentos</th><th>Sueño</th><th>Café / alcohol</th><th>Alergias</th><th>Notas</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
